<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEAS | Secure Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --accent-primary: #00E5FF;
      --accent-secondary: #B055FF;
      --bg-dark: #05050A;
      --text-main: #FFFFFF;
      --text-muted: #8E92A4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto; /* allow scrolling if card is tall */
      padding: 24px 16px;
    }

    /* ── Background ── */
    .bg-image {
      position: fixed; inset: 0; z-index: -3;
      background: url('login-bg.jpg') no-repeat center center;
      background-size: cover;
    }
    .bg-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: rgba(5, 5, 15, 0.08);
    }

    /* ── Card ── */
    .auth-card {
      width: 100%; max-width: 440px;
      background: rgba(10, 10, 20, 0.35);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 32px 32px 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 60px rgba(176,85,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: visible;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    /* Hide scrollbar for Chrome/Safari */
    .auth-card::-webkit-scrollbar { display: none; }
    .auth-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Brand ── */
    .brand {
      text-align: center; margin-bottom: 20px;
    }
    .brand-logo {
      width: 48px; height: 48px; margin: 0 auto 10px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 14px; display: grid; place-items: center;
      font-size: 24px; color: #fff;
      box-shadow: 0 10px 25px rgba(0,229,255,0.3);
    }
    .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 3px; }
    .brand p  { font-size: 13px; color: var(--text-muted); }

    /* ── Tab Switcher ── */
    .tabs {
      display: flex; background: rgba(255,255,255,0.05); border-radius: 12px;
      padding: 4px; margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1; padding: 9px; border-radius: 9px; border: none;
      background: transparent; color: var(--text-muted);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.3s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #000;
      box-shadow: 0 4px 15px rgba(0,229,255,0.3);
    }

    /* ── Panels ── */
    .panel { display: none; animation: fadeIn 0.4s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Input ── */
    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--text-muted); margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .input-wrapper { position: relative; }
    .input-wrapper .icon-left {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 18px; pointer-events: none;
    }
    .input-wrapper .eye-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 18px;
      cursor: pointer; transition: color 0.2s; background: none; border: none;
    }
    .input-wrapper .eye-toggle:hover { color: var(--accent-primary); }
    .input-wrapper input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 13px 44px 13px 44px;
      color: #fff; font-family: inherit; font-size: 15px;
      outline: none; transition: all 0.3s;
    }
    .input-wrapper input:focus {
      border-color: var(--accent-primary);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.12);
    }
    /* no eye = no right padding */
    .input-wrapper input.no-eye { padding-right: 16px; }

    /* ── Forgot row ── */
    .row-forgot {
      display: flex; justify-content: flex-end; margin-top: -6px; margin-bottom: 14px;
    }
    .link-btn {
      background: none; border: none; color: var(--accent-primary);
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity 0.2s;
    }
    .link-btn:hover { opacity: 0.75; }

    /* ── Submit btn ── */
    .btn-submit {
      width: 100%; padding: 15px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #000; font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
      transition: all 0.3s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 229, 255, 0.35);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Messages ── */
    .msg {
      font-size: 13px; text-align: center; margin-top: 14px; display: none; font-weight: 500;
      padding: 10px 14px; border-radius: 10px;
    }
    .msg.error { color: #FF6B8A; background: rgba(255,46,99,0.1); display: block; }
    .msg.success { color: #00FFA3; background: rgba(0,255,163,0.1); display: block; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }

    /* ── Divider ── */
    .divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 38%; height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* ── Switch link ── */
    .switch-row { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 14px; }

    /* ── Forgot Panel ── */
    #forgotPanel .back-btn {
      display: flex; align-items: center; gap: 6px; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600;
      font-family: inherit; margin-bottom: 20px; padding: 0; transition: color 0.2s;
    }
    #forgotPanel .back-btn:hover { color: var(--accent-primary); }

    /* ── OTP Panel ── */
    .otp-boxes {
      display: flex; gap: 10px; justify-content: center; margin: 24px 0;
    }
    .otp-box {
      width: 48px; height: 56px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3); color: #fff; font-size: 22px; font-weight: 700;
      font-family: var(--font-mono, monospace); text-align: center; outline: none;
      transition: all 0.2s; caret-color: var(--accent-primary);
    }
    .otp-box:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.15);
      background: rgba(0,0,0,0.5);
    }
    .otp-hint {
      text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
    }
    .otp-hint span { color: var(--accent-primary); font-weight: 700; }
    .otp-demo-box {
      background: rgba(0,229,255,0.07); border: 1px solid rgba(0,229,255,0.2);
      border-radius: 10px; padding: 10px 16px; text-align: center;
      font-family: monospace; font-size: 22px; font-weight: 800; letter-spacing: 8px;
      color: var(--accent-primary); margin: 12px 0;
    }

    /* ── Animated Stars (Removed) ── */
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="auth-card" id="authCard">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo"><i class="ph-bold ph-fingerprint"></i></div>
      <h1>IEAS Gateway</h1>
      <p>Secure Access to Event Analysis</p>
    </div>

    <!-- Tab Switcher (Login / Sign Up) -->
    <div class="tabs" id="mainTabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn"        onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- ── LOGIN PANEL ── -->
    <div class="panel active" id="loginPanel">
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Full Name or Email</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-user icon-left"></i>
            <input type="text" id="login-user" placeholder="Enter your name or email" required autocomplete="off" class="no-eye" />
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-lock-key icon-left"></i>
            <input type="password" id="login-pass" placeholder="••••••••" required />
            <button type="button" class="eye-toggle" onclick="toggleEye('login-pass', this)">
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <div class="row-forgot">
          <button type="button" class="link-btn" onclick="switchTab('forgot')">Forgot password?</button>
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">
          <i class="ph-bold ph-sign-in"></i> Secure Login
        </button>
        <div class="msg" id="loginMsg"></div>
      </form>

      <div class="switch-row">
        Don't have an account? <button class="link-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>
    </div>

    <!-- ── SIGN UP PANEL ── -->
    <div class="panel" id="signupPanel">
      <form onsubmit="handleSignup(event)">
        <div class="input-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-user icon-left"></i>
            <input type="text" id="signup-name" placeholder="Enter your name" required class="no-eye" />
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-envelope icon-left"></i>
            <input type="email" id="signup-email" placeholder="you@example.com" required class="no-eye" />
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-lock-key icon-left"></i>
            <input type="password" id="signup-pass" placeholder="Min. 6 characters" required />
            <button type="button" class="eye-toggle" onclick="toggleEye('signup-pass', this)">
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-lock-key icon-left"></i>
            <input type="password" id="signup-confirm" placeholder="Re-enter password" required />
            <button type="button" class="eye-toggle" onclick="toggleEye('signup-confirm', this)">
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <i class="ph-bold ph-user-plus"></i> Create Account
        </button>
        <div class="msg" id="signupMsg"></div>
      </form>

      <div class="switch-row">
        Already have an account? <button class="link-btn" onclick="switchTab('login')">Login</button>
      </div>
    </div>



    <!-- ── FORGOT PASSWORD PANEL ── -->
    <div class="panel" id="forgotPanel">
      <button class="back-btn" onclick="switchTab('login')">
        <i class="ph-bold ph-arrow-left"></i> Back to Login
      </button>

      <div class="brand" style="margin-bottom:24px">
        <div class="brand-logo" style="background: linear-gradient(135deg,#B055FF,#FF2E93)">
          <i class="ph-bold ph-key"></i>
        </div>
        <h1 style="font-size:20px">Reset Password</h1>
        <p>Enter your email and we'll send you a reset link</p>
      </div>

      <form onsubmit="handleForgot(event)">
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="ph-fill ph-envelope icon-left"></i>
            <input type="email" id="forgot-email" placeholder="you@example.com" required class="no-eye" />
          </div>
        </div>

        <button type="submit" class="btn-submit" style="background: linear-gradient(135deg,#B055FF,#FF2E93);">
          <i class="ph-bold ph-paper-plane-tilt"></i> Send Reset Link
        </button>
        <div class="msg" id="forgotMsg"></div>
      </form>
    </div>

  </div><!-- /auth-card -->

<script>
  /* ── Tab Switcher ── */

  function switchTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    if (tab === 'login') {
      document.getElementById('loginPanel').classList.add('active');
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('mainTabs').style.display = 'flex';
    } else if (tab === 'signup') {
      document.getElementById('signupPanel').classList.add('active');
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('mainTabs').style.display = 'flex';
    } else if (tab === 'forgot') {
      document.getElementById('forgotPanel').classList.add('active');
      document.getElementById('mainTabs').style.display = 'none';
    } else if (tab === 'otp') {
      document.getElementById('otpPanel').classList.add('active');
      document.getElementById('mainTabs').style.display = 'none';
    }
  }

  /* ── Eye Toggle ───────────────────────────────────── */
  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon  = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'ph-bold ph-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'ph-bold ph-eye';
    }
  }

  /* ── Login ────────────────────────────────────────── */
  async function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    const msg  = document.getElementById('loginMsg');
    const btn  = document.getElementById('loginBtn');

    msg.className = 'msg';
    msg.style.display = 'none';

    // Allow static admin fallback
    if (user === 'admin' && pass === 'admin') {
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"><i class="ph-bold ph-spinner"></i></span> Authenticating...';
      localStorage.setItem('ieas_logged_in', 'true');
      localStorage.setItem('ieas_display_name', 'Admin');
      setTimeout(() => { window.location.href = '/app/'; }, 1200);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"><i class="ph-bold ph-spinner"></i></span> Authenticating...';

    try {
      const res = await fetch('/auth/db/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: user, password: pass })
      });
      const data = await res.json();
      
      if (!res.ok) {
        throw new Error(data.detail || 'Login failed');
      }

      // Success
      localStorage.setItem('ieas_logged_in', 'true');
      localStorage.setItem('ieas_display_name', data.name);
      localStorage.setItem('ieas_email', data.email);
      setTimeout(() => { window.location.href = '/app/'; }, 1200);

    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = 'Secure Login <i class="ph-bold ph-arrow-right"></i>';
      msg.textContent = '❌ ' + err.message;
      msg.style.display = 'block';
      msg.classList.add('error');
      shake(document.getElementById('authCard'));
    }
  }

  /* ── Sign Up ──────────────────────────────────────── */
  async function handleSignup(e) {
    e.preventDefault();
    const name    = document.getElementById('signup-name').value.trim();
    const email   = document.getElementById('signup-email').value.trim();
    const pass    = document.getElementById('signup-pass').value;
    const confirm = document.getElementById('signup-confirm').value;
    const msg     = document.getElementById('signupMsg');
    const btn     = e.target.querySelector('button[type="submit"]');

    msg.className = 'msg';
    msg.style.display = 'block';

    if (pass.length < 6) {
      msg.textContent = '❌ Password must be at least 6 characters.';
      msg.classList.add('error'); return;
    }
    if (pass !== confirm) {
      msg.textContent = '❌ Passwords do not match.';
      msg.classList.add('error'); return;
    }

    const oldHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"><i class="ph-bold ph-spinner"></i></span> Creating...';

    try {
      const res = await fetch('/auth/db/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password: pass })
      });
      const data = await res.json();
      
      if (!res.ok) {
        throw new Error(data.detail || 'Signup failed');
      }

      msg.textContent = '✅ Account created! Redirecting to login...';
      msg.className = 'msg success';
      setTimeout(() => switchTab('login'), 1500);

    } catch (err) {
      msg.textContent = '❌ ' + err.message;
      msg.classList.add('error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = oldHtml;
    }
  }


  /* ── Forgot Password ──────────────────────────────── */
  function handleForgot(e) {
    e.preventDefault();
    const email = document.getElementById('forgot-email').value;
    const msg   = document.getElementById('forgotMsg');
    msg.textContent = `✅ Reset link sent to ${email}. Check your inbox!`;
    msg.className = 'msg success';
  }

  /* ── Shake animation ──────────────────────────────── */
  function shake(el) {
    el.style.transition = 'transform 0.08s';
    const seq = [12, -12, 10, -10, 6, 0];
    let i = 0;
    const next = () => {
      if (i < seq.length) {
        el.style.transform = `translateX(${seq[i++]}px)`;
        setTimeout(next, 80);
      }
    };
    next();
  }

</script>
</body>
</html>
